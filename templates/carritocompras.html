<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart Shopping</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #eaf4fb;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1.5px solid #c2e0f4;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-inicio {
      background: none;
      border: 1.5px solid #c2e0f4;
      border-radius: 10px;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      cursor: pointer;
      color: #3a8abf;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn-inicio:hover { background: #eaf4fb; }

    header h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 26px;
      color: #1a5f8a;
      flex: 1;
      text-align: center;
    }

    .cart-list {
      max-width: 700px;
      margin: 24px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .cart-empty {
      text-align: center;
      padding: 60px 20px;
      color: #7ab5d4;
      font-size: 15px;
      font-weight: 700;
    }

    .cart-empty span { font-size: 48px; display: block; margin-bottom: 12px; }

    .cart-item {
      background: #fff;
      border: 1.5px solid #c2e0f4;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      transition: box-shadow 0.2s;
    }

    .cart-item:hover {
      box-shadow: 0 4px 16px rgba(58,138,191,0.12);
    }

    .item-emoji {
      font-size: 52px;
      background: #eaf4fb;
      border-radius: 12px;
      width: 80px; height: 80px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      filter: drop-shadow(1px 2px 0px rgba(0,0,0,0.08));
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-size: 14px;
      font-weight: 800;
      color: #1a5f8a;
      margin-bottom: 4px;
    }

    .item-cat {
      font-size: 11px;
      color: #7ab5d4;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .item-price {
      font-family: 'Fredoka One', cursive;
      font-size: 18px;
      color: #3a8abf;
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      background: #eaf4fb;
      border: 1.5px solid #c2e0f4;
      border-radius: 8px;
      width: 28px; height: 28px;
      font-size: 16px;
      font-weight: 800;
      color: #3a8abf;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }

    .qty-btn:hover { background: #c2e0f4; }

    .qty-num {
      font-weight: 800;
      font-size: 15px;
      color: #1a5f8a;
      min-width: 20px;
      text-align: center;
    }

    .delete-btn {
      background: none;
      border: 1.5px solid #c2e0f4;
      border-radius: 10px;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: #7ab5d4;
      font-size: 18px;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      background: #fde8f0;
      border-color: #f7c5d8;
      color: #e8638c;
    }

    .cart-footer {
      max-width: 700px;
      margin: 8px auto 40px;
      padding: 0 20px;
    }

    .total-box {
      background: #fff;
      border: 1.5px solid #c2e0f4;
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .total-label {
      font-size: 14px;
      font-weight: 700;
      color: #7ab5d4;
    }

    .total-amount {
      font-family: 'Fredoka One', cursive;
      font-size: 24px;
      color: #1a5f8a;
    }

    .footer-btns {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn-volver {
      background: #fff;
      border: 1.5px solid #c2e0f4;
      border-radius: 20px;
      padding: 9px 22px;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: #3a8abf;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn-volver:hover { background: #eaf4fb; }

    .btn-comprar {
      background: #3a8abf;
      border: none;
      border-radius: 20px;
      padding: 9px 22px;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-comprar:hover { background: #2a6e9e; }
  </style>
</head>
<body>

  <header>
    <div class="footer-btns">
  <a href="index.html" class="btn-volver"> Inicio</a>
  <a href="shop.html" class="btn-volver">← Volver</a>
  <button class="btn-comprar">Finalizar compra</button>
</div>
  </header>

  <div class="cart-list" id="cartList"></div>

  <div class="cart-footer" id="cartFooter" style="display:none">
    <div class="total-box">
      <span class="total-label">Total</span>
      <span class="total-amount" id="totalAmount">$0</span>
    </div>
    <div class="footer-btns">
      <a href="shop.html" class="btn-volver">← Volver</a>
      <button class="btn-comprar" onclick="window.location.href='fincompra.html'">Finalizar compra</button>
    </div>
  </div>

  <script>
    // IMPORTANTE: misma llave y misma forma de datos que usa shop.html
    // shop.html guarda: { id, nombre, precio (numero), emoji, qty }
    function getCart() {
      return JSON.parse(localStorage.getItem('huellas_carrito') || '[]');
    }

    function saveCart(cart) {
      localStorage.setItem('huellas_carrito', JSON.stringify(cart));
    }

    function calcTotal(cart) {
      return cart.reduce((sum, item) => sum + (item.precio * item.qty), 0);
    }

    function formatPrice(n) {
      return '$' + n.toLocaleString('es-CO');
    }

    function render() {
      const cart = getCart();
      const list = document.getElementById('cartList');
      const footer = document.getElementById('cartFooter');

      if (cart.length === 0) {
        list.innerHTML = `
          <div class="cart-empty">
            <span>🛒</span>
            Tu carrito está vacío.<br>¡Agrega productos desde la tienda!
          </div>`;
        footer.style.display = 'none';
        return;
      }

      footer.style.display = 'block';
      list.innerHTML = cart.map((item, i) => `
        <div class="cart-item">
          <div class="item-emoji">${item.emoji}</div>
          <div class="item-info">
            <div class="item-name">${item.nombre}</div>
            <div class="item-price">${formatPrice(item.precio)}</div>
          </div>
          <div class="qty-control">
            <button class="qty-btn" onclick="changeQty(${i}, -1)">−</button>
            <span class="qty-num">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
          </div>
          <button class="delete-btn" onclick="removeItem(${i})" title="Eliminar">🗑️</button>
        </div>
      `).join('');

      document.getElementById('totalAmount').textContent = formatPrice(calcTotal(cart));
    }

    function changeQty(i, delta) {
      const cart = getCart();
      cart[i].qty += delta;
      if (cart[i].qty <= 0) cart.splice(i, 1);
      saveCart(cart);
      render();
    }

    function removeItem(i) {
      const cart = getCart();
      cart.splice(i, 1);
      saveCart(cart);
      render();
    }

    render();
  </script>

</body>
</html>
