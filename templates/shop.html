<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda – Huellas a Casa</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rosa-claro: #fce4ec;
    --rosa-medio: #f8bbd0;
    --rosa-acento: #f48fb1;
    --rosa-fuerte: #e91e8c;
    --rosa-texto: #ad1457;
    --blanco: #fff9fb;
    --sombra: rgba(244,143,177,0.18);
    --radio: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #fce4ec 0%, #fdf6f9 40%, #fce4ec 100%);
    min-height: 100vh;
    color: #5a2a3a;
  }

  nav {
    background: var(--blanco);
    border-bottom: 2px solid var(--rosa-medio);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px var(--sombra);
  }

  .nav-left { display: flex; gap: 12px; align-items: center; }

  .nav-btn {
    background: var(--rosa-claro);
    border: 2px solid var(--rosa-acento);
    border-radius: 30px;
    padding: 8px 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Baloo 2', cursive;
    transition: background 0.2s, transform 0.15s;
    text-decoration: none;
    color: var(--rosa-texto);
    white-space: nowrap;
  }
  .nav-btn:hover { background: var(--rosa-medio); transform: scale(1.05); }

  .nav-title {
    font-family: 'Baloo 2', cursive;
    font-size: 26px;
    font-weight: 700;
    color: var(--rosa-texto);
    letter-spacing: 1px;
    text-align: center;
    flex: 1;
  }
  .nav-title span { font-size: 14px; display: block; font-weight: 400; color: var(--rosa-acento); margin-top: -4px; }

  .nav-right { display: flex; align-items: center; gap: 12px; }

  .search-box {
    background: var(--rosa-claro);
    border: 1.5px solid var(--rosa-acento);
    border-radius: 30px;
    padding: 6px 16px;
    font-size: 14px;
    color: var(--rosa-texto);
    outline: none;
    font-family: 'Nunito', sans-serif;
    width: 160px;
    transition: border-color 0.2s;
  }
  .search-box::placeholder { color: var(--rosa-acento); }
  .search-box:focus { border-color: var(--rosa-fuerte); }

  .cart-btn {
    background: var(--rosa-acento);
    border: 2px solid var(--rosa-texto);
    border-radius: 30px;
    padding: 8px 18px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Baloo 2', cursive;
    color: white;
    position: relative;
    transition: background 0.2s, transform 0.15s;
    text-decoration: none;
    white-space: nowrap;
  }
  .cart-btn:hover { background: var(--rosa-fuerte); transform: scale(1.05); }

  .cart-badge {
    position: absolute;
    top: -4px; right: -4px;
    background: #e91e63;
    color: white;
    font-size: 11px;
    font-weight: 700;
    width: 18px; height: 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid white;
    font-family: 'Nunito', sans-serif;
  }

  main { padding: 32px 24px 48px; }

  .section-title {
    font-family: 'Baloo 2', cursive;
    font-size: 20px;
    color: var(--rosa-texto);
    margin-bottom: 24px;
    display: flex; align-items: center; gap: 8px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 24px;
  }

  .card {
    background: white;
    border-radius: 24px;
    padding: 16px 16px 14px;
    border: 3px solid var(--rosa-medio);
    box-shadow: 4px 4px 0px var(--rosa-acento), 0 0 0 6px #fff, 0 0 0 7px var(--rosa-medio);
    transition: transform 0.18s, box-shadow 0.18s;
    cursor: default;
    position: relative;
    animation: popIn 0.4s ease both;
  }
  .card:hover {
    transform: translateY(-6px) rotate(-1deg);
    box-shadow: 8px 8px 0px var(--rosa-acento), 0 0 0 6px #fff, 0 0 0 7px var(--rosa-medio);
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .card-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    background: var(--rosa-claro);
    display: flex; align-items: center; justify-content: center;
    font-size: 52px;
    margin-bottom: 12px;
    overflow: hidden;
    border: 2px dashed var(--rosa-acento);
    position: relative;
  }

  .card-img::after {
    content: '';
    position: absolute;
    top: 8px; left: 8px;
    width: 28%; height: 18%;
    background: rgba(255,255,255,0.55);
    border-radius: 50%;
    transform: rotate(-30deg);
    pointer-events: none;
  }

  .card-name {
    font-family: 'Baloo 2', cursive;
    font-size: 15px;
    font-weight: 700;
    color: #8e2257;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-price {
    font-size: 14px;
    font-weight: 700;
    color: var(--rosa-fuerte);
    margin-bottom: 10px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .card-desc {
    font-size: 12px;
    color: var(--rosa-acento);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .add-btn {
    background: var(--rosa-acento);
    border: 2px solid var(--rosa-texto);
    border-radius: 50%;
    width: 32px; height: 32px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    color: white;
    font-weight: 700;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
    line-height: 1;
    font-family: 'Baloo 2', cursive;
  }
  .add-btn:hover { background: var(--rosa-fuerte); transform: scale(1.15); }
  .add-btn:active { transform: scale(0.95); }

  #toast {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #e91e63;
    color: white;
    padding: 10px 24px;
    border-radius: 30px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 0 4px 18px rgba(233,30,99,0.35);
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none;
    z-index: 999;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  body::before {
    content: '🐾';
    position: fixed;
    top: 12%; right: 3%;
    font-size: 80px;
    opacity: 0.07;
    pointer-events: none;
    transform: rotate(15deg);
  }
  body::after {
    content: '🐾';
    position: fixed;
    bottom: 8%; left: 2%;
    font-size: 110px;
    opacity: 0.07;
    pointer-events: none;
    transform: rotate(-20deg);
  }
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="index.html" class="nav-btn">🏠 Inicio</a>
  </div>
  <div class="nav-title">
    HUELLAS A CASA
    <span>🐾 Tienda Veterinaria</span>
  </div>
  <div class="nav-right">
    <input class="search-box" type="text" placeholder="Buscar..." id="searchInput" oninput="filtrarProductos()">
    <a href="carritocompras.html" class="cart-btn" id="cartBtn">
      🛒 Carrito de compras
      <span class="cart-badge" id="cartBadge">0</span>
    </a>
  </div>
</nav>

<main>
  <div class="section-title">✨ Nuestros productos</div>
  <div class="grid" id="productGrid"></div>
</main>

<div id="toast"></div>

<script>
const productos = [
  { id: 1, nombre: "Collar Anti-Pulgas",     precio: 18900, emoji: "🐕", desc: "Protección 8 meses" },
  { id: 2, nombre: "Vitaminas para Gatos",   precio: 24500, emoji: "🐱", desc: "30 tabletas masticables" },
  { id: 3, nombre: "Arena Sanitaria",        precio: 32000, emoji: "🪣", desc: "Bolsa 10 kg" },
  { id: 4, nombre: "Snacks Dentales",        precio: 15000, emoji: "🦴", desc: "Limpieza dental" },
  { id: 5, nombre: "Shampoo Hipoalergénico", precio: 21000, emoji: "🛁", desc: "500 ml, sin parabenos" },
  { id: 6, nombre: "Cama Ortopédica",        precio: 89000, emoji: "🛏️", desc: "Talla mediana" },
  { id: 7, nombre: "Pipeta Antipulgas",      precio: 28000, emoji: "💧", desc: "Pack x3" },
  { id: 8, nombre: "Juguete Plumas",         precio: 12500, emoji: "🪶", desc: "Interactivo felinos" },
  { id: 9, nombre: "Comedero Antiansiedad",  precio: 37000, emoji: "🥣", desc: "Reduce estrés" },
];

let carrito = JSON.parse(localStorage.getItem('huellas_carrito') || '[]');
let toastTimer;

function obtenerUsuario() {
  return JSON.parse(sessionStorage.getItem('usuario') || 'null');
}

function actualizarBadge() {
  const total = carrito.reduce((a, b) => a + b.qty, 0);
  document.getElementById('cartBadge').textContent = total;
}

function mostrarToast(nombre) {
  const t = document.getElementById('toast');
  t.textContent = '🛒 ' + nombre + ' agregado!';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function agregarAlCarrito(id) {
  // Sin sesión iniciada no se permite agregar productos al carrito.
  const usuarioActual = obtenerUsuario();
  if (!usuarioActual) {
    alert('Debes iniciar sesión para agregar productos al carrito.');
    window.location.href = 'iniciarsesion.html';
    return;
  }

  const p = productos.find(x => x.id === id);
  const idx = carrito.findIndex(x => x.id === id);
  if (idx >= 0) carrito[idx].qty++;
  else carrito.push({ id: p.id, nombre: p.nombre, precio: p.precio, emoji: p.emoji, qty: 1 });
  localStorage.setItem('huellas_carrito', JSON.stringify(carrito));
  actualizarBadge();
  mostrarToast(p.nombre);
}

function formatPrecio(n) {
  return '$' + n.toLocaleString('es-CO');
}

function crearCard(p) {
  return `
    <div class="card" id="card-${p.id}">
      <div class="card-img">${p.emoji}</div>
      <div class="card-name">${p.nombre}</div>
      <div class="card-price">${formatPrecio(p.precio)}</div>
      <div class="card-footer">
        <span class="card-desc">${p.desc}</span>
        <button class="add-btn" onclick="agregarAlCarrito(${p.id})" title="Agregar al carrito">+</button>
      </div>
    </div>
  `;
}

function filtrarProductos() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtrados = productos.filter(p =>
    p.nombre.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q)
  );
  document.getElementById('productGrid').innerHTML = filtrados.map(crearCard).join('');
}

document.getElementById('productGrid').innerHTML = productos.map(crearCard).join('');
actualizarBadge();
</script>
</body>
</html>
