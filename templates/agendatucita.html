<!DOCTYPE html>
 <html lang="es">
     <head>
         <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Agenda tu cita - Clinica Veterinaria</title>
          <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #e1e8ed;
        }

        h2 {
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 15px;
            font-weight: 500;
        }

        .input-text {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #cbd5e0;
            border-radius: 8px;
            font-size: 16px;
            color: #2d3748;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-text:focus {
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
        }
        .mascota-options {
            margin-top: 10px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
            font-size: 16px;
            color: #2d3748;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            accent-color: #4299e1; /* Color del check adaptado a navegadores modernos */
            cursor: pointer;
        }

        /* Input de texto en linea para la opcion "Otro" */
        .input-inline {
            border: none;
            border-bottom: 1.5px solid #cbd5e0;
            padding: 2px 5px;
            font-size: 16px;
            margin-left: 8px;
            outline: none;
            width: 150px;
            transition: border-color 0.2s;
        }

        .input-inline:focus {
            border-bottom-color: #4299e1;
        }

        .button-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            text-align: center;
        }

        .btn-primary {
            background-color: #ffffff;
            color: #2d3748;
            border: 2px solid #2d3748;
        }

        .btn-primary:hover {
            background-color: #2d3748;
            color: #ffffff;
        }

        .btn-secondary {
            background-color: #ffffff;
            color: #718096;
            border: 1.5px solid #cbd5e0;
        }

        .btn-secondary:hover {
            background-color: #f7fafc;
            color: #4a5568;
            border-color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="form-container">
    <h2>Agenda tu cita</h2>
    
    <form action="#" method="POST">
        <div class="form-group">
            <label for="nombre-dueno">Nombre del dueño</label>
            <input type="text" id="nombre-dueno" name="nombre_dueno" class="input-text" required>
        </div>

        <div class="form-group">
            <label for="telefono">Telefono</label>
            <input type="tel" id="telefono" name="telefono" class="input-text" required>
        </div>

        <div class="form-group">
            <label for="nombre-mascota">Nombre de la mascota</label>
            <input type="text" id="nombre-mascota" name="nombre_mascota" class="input-text" required>
        </div>

        <div class="form-group">
            <label>Elige tu tipo de mascota</label>
            <div class="mascota-options">
                <label class="checkbox-group">
                    <input type="checkbox" name="tipo_mascota" value="perro"> Perro
                </label>
                <label class="checkbox-group">
                    <input type="checkbox" name="tipo_mascota" value="gato"> Gato
                </label>
                <label class="checkbox-group">
                    <input type="checkbox" name="tipo_mascota" value="ave"> Ave
                </label>
                <label class="checkbox-group">
                    <input type="checkbox" name="tipo_mascota" value="otro" id="chk-otro"> 
                    Otro <input type="text" name="tipo_mascota_otro" class="input-inline" placeholder="Cual?">
                </label>
            </div>
        </div>

       <div class="button-container">
            <button type="button" class="btn btn-primary" onclick="siguientePaso()">Siguiente</button>
            <a href="index.html" class="btn btn-secondary">Volver al menu principal</a>
        </div>
    </form>
</div>

<script>
  const usuarioActual = JSON.parse(sessionStorage.getItem('usuario') || 'null');
  if (!usuarioActual) {
    alert('Debes iniciar sesión para agendar una cita.');
    window.location.href = 'iniciarsesion.html';
  }

  function siguientePaso() {
    const nombreDueno = document.getElementById('nombre-dueno').value.trim();
    const telefono = document.getElementById('telefono').value.trim();
    const nombreMascota = document.getElementById('nombre-mascota').value.trim();
    const tipoSeleccionado = document.querySelector('input[name="tipo_mascota"]:checked');
    const tipoOtroInput = document.querySelector('input[name="tipo_mascota_otro"]');

    if (!nombreDueno || !telefono || !nombreMascota || !tipoSeleccionado) {
      alert('Por favor completa todos los campos y selecciona el tipo de mascota.');
      return;
    }

    const citaData = {
      id_usuario: usuarioActual.id,
      nombre_dueno: nombreDueno,
      telefono: telefono,
      nombre_mascota: nombreMascota,
      tipo_mascota: tipoSeleccionado.value,
      tipo_mascota_otro: tipoSeleccionado.value === 'otro' ? tipoOtroInput.value.trim() : null
    };

    sessionStorage.setItem('citaData', JSON.stringify(citaData));
    window.location.href = 'tablero.html';
  }
</script>
