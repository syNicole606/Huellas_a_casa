<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalizar Compra</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #eaf4fb;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1.5px solid #c2e0f4;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 24px;
      color: #1a5f8a;
      flex: 1;
      text-align: center;
    }

    .btn-back {
      background: none;
      border: 1.5px solid #c2e0f4;
      border-radius: 10px;
      padding: 6px 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 800;
      color: #3a8abf;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn-back:hover { background: #eaf4fb; }

    .page {
      max-width: 620px;
      margin: 28px auto 60px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-box {
      background: #fff;
      border: 1.5px solid #c2e0f4;
      border-radius: 18px;
      padding: 22px 24px;
    }

    .section-title {
      font-family: 'Fredoka One', cursive;
      font-size: 17px;
      color: #1a5f8a;
      margin-bottom: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 14px;
    }

    .form-group:last-child { margin-bottom: 0; }

    label {
      font-size: 12px;
      font-weight: 700;
      color: #7ab5d4;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"] {
      border: 1.5px solid #c2e0f4;
      border-radius: 10px;
      padding: 9px 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      color: #1a5f8a;
      background: #f5fafd;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus {
      border-color: #3a8abf;
      background: #fff;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .payment-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .payment-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1.5px solid #c2e0f4;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s;
      background: #f5fafd;
    }

    .payment-option:hover {
      border-color: #3a8abf;
      background: #eaf4fb;
    }

    .payment-option input[type="checkbox"] {
      accent-color: #3a8abf;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .payment-option span {
      font-size: 13px;
      font-weight: 700;
      color: #1a5f8a;
    }

    .payment-option .pay-emoji {
      font-size: 18px;
      margin-left: auto;
    }

    .resumen-title {
      font-family: 'Fredoka One', cursive;
      font-size: 20px;
      color: #1a5f8a;
      text-align: center;
      margin-bottom: 16px;
    }

    .resumen-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .resumen-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: #f5fafd;
      border-radius: 12px;
      border: 1px solid #c2e0f4;
    }

    .resumen-emoji {
      font-size: 30px;
      width: 44px;
      text-align: center;
    }

    .resumen-info {
      flex: 1;
    }

    .resumen-name {
      font-size: 12px;
      font-weight: 800;
      color: #1a5f8a;
    }

    .resumen-qty {
      font-size: 11px;
      color: #7ab5d4;
      font-weight: 600;
    }

    .resumen-price {
      font-family: 'Fredoka One', cursive;
      font-size: 15px;
      color: #3a8abf;
    }

    .resumen-empty {
      text-align: center;
      color: #7ab5d4;
      font-size: 13px;
      font-weight: 700;
      padding: 20px 0;
    }

    .envio-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-top: 1px dashed #c2e0f4;
      font-size: 13px;
      color: #7ab5d4;
      font-weight: 700;
    }

    .total-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: #eaf4fb;
      border-radius: 14px;
      border: 1.5px solid #c2e0f4;
      margin-top: 6px;
    }

    .total-label {
      font-size: 14px;
      font-weight: 800;
      color: #3a8abf;
    }

    .total-amount {
      font-family: 'Fredoka One', cursive;
      font-size: 26px;
      color: #1a5f8a;
    }

    .btn-comprar {
      width: 100%;
      background: #3a8abf;
      border: none;
      border-radius: 16px;
      padding: 14px;
      font-family: 'Fredoka One', cursive;
      font-size: 18px;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    .btn-comprar:hover { background: #2a6e9e; transform: scale(1.01); }
    .btn-comprar:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .success-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26,95,138,0.25);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .success-modal.show { display: flex; }

    .success-box {
      background: #fff;
      border: 2px solid #c2e0f4;
      border-radius: 24px;
      padding: 40px 36px;
      text-align: center;
      max-width: 340px;
      width: 90%;
    }

    .success-box .check { font-size: 56px; margin-bottom: 12px; }

    .success-box h2 {
      font-family: 'Fredoka One', cursive;
      font-size: 24px;
      color: #1a5f8a;
      margin-bottom: 8px;
    }

    .success-box p {
      font-size: 13px;
      color: #7ab5d4;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .btn-ok {
      background: #3a8abf;
      border: none;
      border-radius: 14px;
      padding: 10px 32px;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-ok:hover { background: #2a6e9e; }
  </style>
</head>
<body>

  <header>
    <a href="carritocompras.html" class="btn-back">Volver</a>
    <h1>Finalizar Compra</h1>
    <a href="index.html" class="btn-back">Inicio</a>
  </header>

  <div class="page">

    <!-- Datos personales -->
    <div class="section-box">
      <div class="section-title">Datos de envío</div>

      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" id="nombre" placeholder="Ej: María García">
      </div>

      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="correo" placeholder="correo@ejemplo.com">
      </div>

      <div class="form-group">
        <label>Número telefónico</label>
        <input type="tel" id="telefono" placeholder="+57 300 000 0000">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>País</label>
          <input type="text" id="pais" placeholder="Colombia">
        </div>
        <div class="form-group">
          <label>Ciudad</label>
          <input type="text" id="ciudad" placeholder="Bogotá">
        </div>
      </div>

      <div class="form-group">
        <label>Dirección</label>
        <input type="text" id="direccion" placeholder="Calle 123 # 45-67">
      </div>

      <div class="form-group">
        <label>Código postal</label>
        <input type="text" id="postal" placeholder="110111">
      </div>
    </div>

    <!-- Métodos de pago -->
    <div class="section-box">
      <div class="section-title">💳 Método de pago</div>
      <div class="payment-options">
        <label class="payment-option">
          <input type="radio" name="pago" value="credito">
          <span>Tarjeta de crédito</span>
          <span class="pay-emoji">💳</span>
        </label>
        <label class="payment-option">
          <input type="radio" name="pago" value="debito">
          <span>Tarjeta de débito</span>
          <span class="pay-emoji">🏦</span>
        </label>
        <label class="payment-option">
          <input type="radio" name="pago" value="transferencia">
          <span>Transferencia bancaria</span>
          <span class="pay-emoji">🔄</span>
        </label>
        <!-- value cambiado de "plataforma" a "nequi" para que coincida con el ENUM metodo_pago de la BD -->
        <label class="payment-option">
          <input type="radio" name="pago" value="nequi">
          <span>Plataformas de pago (PayPal, Nequi, etc.)</span>
          <span class="pay-emoji">📱</span>
        </label>
      </div>
    </div>

    <!-- Resumen del pedido -->
    <div class="section-box">
      <div class="resumen-title">Resumen del pedido</div>
      <div class="resumen-items" id="resumenItems"></div>
      <div class="envio-row">
        <span>Costo de envío</span>
        <span>$8.000</span>
      </div>
      <div class="total-box">
        <span class="total-label">Precio total</span>
        <span class="total-amount" id="totalFinal">$0</span>
      </div>
    <button class="btn-comprar" id="btnComprar" onclick="realizarCompra()">
  Finalizar compra
</button>
    </div>

  </div>

  <!-- Modal éxito -->
<div class="success-modal" id="successModal">
  <div class="success-box">
    <div class="check">🎉</div>
    <h2>¡Tu compra ha sido registrada!</h2>
    <p>Gracias por confiar en Huellas a Casa 🐾</p>

    <div class="success-items" id="successItems"></div>

    <div class="success-total" id="successTotal"></div>

    <button class="btn-ok" onclick="window.location.href='index.html'">Volver al inicio</button>
  </div>
</div>

  <script>
const ENVIO = 8000;

// Guardia de sesión: sin usuario iniciado no se puede acceder a esta pantalla.
const usuarioActual = JSON.parse(sessionStorage.getItem('usuario') || 'null');
if (!usuarioActual) {
  alert('Debes iniciar sesión para finalizar tu compra.');
  window.location.href = 'iniciarsesion.html';
}

function getCart() {
  return JSON.parse(localStorage.getItem('huellas_carrito') || '[]');
}

function obtenerUsuario() {
  return JSON.parse(sessionStorage.getItem('usuario') || 'null');
}

function formatPrice(n) {
  return '$' + n.toLocaleString('es-CO');
}

function calcTotal(cart) {
  return cart.reduce((sum, item) => {
    return sum + (item.precio * item.qty);
  }, 0);
}

function render() {
  const cart = getCart();
  const container = document.getElementById('resumenItems');

  if (cart.length === 0) {
    container.innerHTML =
      '<div class="resumen-empty">No hay productos en el carrito</div>';

    document.getElementById('totalFinal').textContent =
      formatPrice(ENVIO);

    return;
  }

  container.innerHTML = cart.map(item => `
    <div class="resumen-item">
      <div class="resumen-emoji">${item.emoji}</div>

      <div class="resumen-info">
        <div class="resumen-name">${item.nombre}</div>
        <div class="resumen-qty">
          Cantidad: ${item.qty}
        </div>
      </div>

      <div class="resumen-price">
        ${formatPrice(item.precio)}
      </div>
    </div>
  `).join('');

  const total = calcTotal(cart) + ENVIO;

  document.getElementById('totalFinal').textContent =
    formatPrice(total);
}

async function realizarCompra() {

  const nombre = document.getElementById('nombre').value.trim();
  const correo = document.getElementById('correo').value.trim();
  const telefono = document.getElementById('telefono').value.trim();
  const pais = document.getElementById('pais').value.trim();
  const ciudad = document.getElementById('ciudad').value.trim();
  const direccion = document.getElementById('direccion').value.trim();
  const postal = document.getElementById('postal').value.trim();

  const pago = document.querySelector('input[name="pago"]:checked');

  if (!nombre || !correo || !telefono || !pais || !ciudad || !direccion) {
    alert('Por favor completa todos los datos de envío.');
    return;
  }

  if (!pago) {
    alert('Selecciona un método de pago.');
    return;
  }

  const cart = getCart();

  if (cart.length === 0) {
    alert('Tu carrito está vacío.');
    return;
  }

  // La tabla "pedidos" requiere un id_usuario, por eso se necesita sesión iniciada
  const usuarioActual = obtenerUsuario();
  if (!usuarioActual) {
    alert('Debes iniciar sesión para completar la compra.');
    window.location.href = 'iniciarsesion.html';
    return;
  }

  const btn = document.getElementById('btnComprar');
  btn.disabled = true;
  btn.textContent = 'Procesando...';

  try {
    const respuesta = await fetch('https://huellas-a-casa-backend.onrender.com/api/finalizar_compra', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id_usuario: usuarioActual.id,
        nombre: nombre,
        correo: correo,
        telefono: telefono,
        pais: pais,
        ciudad: ciudad,
        direccion: direccion,
        codigo_postal: postal,
        metodo_pago: pago.value,
        carrito: cart.map(item => ({
          id: item.id,
          nombre: item.nombre,
          precio: item.precio,
          qty: item.qty
        }))
      })
    });

    const data = await respuesta.json();

    if (!data.exito) {
      alert(data.mensaje || 'No se pudo procesar la compra.');
      btn.disabled = false;
      btn.textContent = 'Finalizar compra';
      return;
    }

    document.getElementById('successItems').innerHTML =
      cart.map(item => `
        <div style="margin:8px 0;">
          ${item.emoji} ${item.nombre} x${item.qty}
        </div>
      `).join('');

    document.getElementById('successTotal').innerHTML =
      '<strong>Total pagado: ' + formatPrice(data.total) + '</strong>';

    localStorage.removeItem('huellas_carrito');

    document.getElementById('successModal').classList.add('show');

  } catch (error) {
    alert('Error de conexión al procesar la compra.');
    btn.disabled = false;
    btn.textContent = 'Finalizar compra';
    console.error(error);
  }
}

render();
</script>
  

</body>
</html>
