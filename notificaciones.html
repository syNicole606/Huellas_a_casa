<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Notificaciones - Huellas a Casa</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
        }
        .notifications-container { 
            width: 100%; 
            max-width: 500px; 
            background: white; 
            min-height: 100vh; 
            box-shadow: 0 0 10px rgba(0,0,0,0.05); 
        }
        header { 
            padding: 20px; 
            background-color: #fff; 
            border-bottom: 1px solid #eee; 
            display: flex; 
            align-items: center; 
        }
        .btn-back { 
            background: none; 
            border: none; 
            font-size: 20px; 
            cursor: pointer; 
            margin-right: 15px; 
        }
        h2 { margin: 0; font-size: 1.2rem; color: #333; flex: 1; }

        .badge-pendientes {
            background: #007bff;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            border-radius: 20px;
            padding: 3px 10px;
            display: none;
        }
        
        .notification-list { list-style: none; padding: 0; margin: 0; }
        .notification-item { 
            padding: 15px 20px; 
            border-bottom: 1px solid #f0f0f0; 
            display: flex; 
            gap: 15px; 
            transition: background 0.3s;
            cursor: pointer;
        }
        .notification-item:hover { background-color: #f9f9f9; }
        .notification-item.unread { background-color: #e3f2fd; }
        
        .icon { 
            width: 45px; 
            height: 45px; 
            background: #eee; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 20px; 
            flex-shrink: 0;
        }
        .content { flex: 1; min-width: 0; }
        .content .title { font-weight: bold; font-size: 14px; margin-bottom: 3px; color: #222; }
        .content .desc { font-size: 13px; color: #666; line-height: 1.4; }
        .content .time { font-size: 11px; color: #999; margin-top: 5px; }
        
        .unread-dot { 
            width: 8px; 
            height: 8px; 
            background-color: #007bff; 
            border-radius: 50%; 
            align-self: center; 
            flex-shrink: 0;
        }

        .estado-vacio {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 14px;
        }
        .estado-vacio .emoji { font-size: 42px; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="notifications-container">
        <header>
            <button class="btn-back" onclick="window.history.back()">←</button>
            <h2>Notificaciones</h2>
            <span class="badge-pendientes" id="badgePendientes">0</span>
        </header>

        <ul class="notification-list" id="listaNotificaciones">
            <li class="estado-vacio">Cargando...</li>
        </ul>
    </div>

<script>
const iconosPorTipo = {
    cita: '📅',
    pedido: '🛍️',
    promocion: '🐾',
    sistema: '🔔'
};

function obtenerUsuario() {
    return JSON.parse(sessionStorage.getItem('usuario') || 'null');
}

async function cargarNotificaciones() {
    const lista = document.getElementById('listaNotificaciones');
    const badge = document.getElementById('badgePendientes');
    const usuarioActual = obtenerUsuario();

    if (!usuarioActual) {
        lista.innerHTML = '<li class="estado-vacio"><span class="emoji">🔒</span>Debes iniciar sesión para ver tus notificaciones.</li>';
        return;
    }

    try {
        const respuesta = await fetch(`https://Nicol99gar.pythonanywhere.com/api/notificaciones?id_usuario=${usuarioActual.id}`);
        const data = await respuesta.json();

        if (!data.exito) {
            lista.innerHTML = `<li class="estado-vacio">${data.mensaje}</li>`;
            return;
        }

        if (data.notificaciones.length === 0) {
            lista.innerHTML = '<li class="estado-vacio"><span class="emoji">🔔</span>No tienes notificaciones por ahora.</li>';
            badge.style.display = 'none';
            return;
        }

        const noLeidas = data.notificaciones.filter(n => !n.leida).length;
        if (noLeidas > 0) {
            badge.textContent = noLeidas;
            badge.style.display = 'inline-block';
        } else {
            badge.style.display = 'none';
        }

        lista.innerHTML = data.notificaciones.map(n => `
            <li class="notification-item ${n.leida ? '' : 'unread'}" data-id="${n.id}" onclick="marcarComoLeida(${n.id}, this)">
                <div class="icon">${iconosPorTipo[n.tipo] || '🔔'}</div>
                <div class="content">
                    <div class="title">${n.titulo}</div>
                    <div class="desc">${n.descripcion}</div>
                    <div class="time">${n.tiempo}</div>
                </div>
                ${n.leida ? '' : '<div class="unread-dot"></div>'}
            </li>
        `).join('');

    } catch (error) {
        lista.innerHTML = '<li class="estado-vacio">Error de conexión con el servidor.</li>';
        console.error(error);
    }
}

async function marcarComoLeida(idNotificacion, elemento) {
    const usuarioActual = obtenerUsuario();
    if (!usuarioActual) return;

    // Si ya estaba leída, no hace falta llamar al servidor de nuevo
    if (!elemento.classList.contains('unread')) return;

    elemento.classList.remove('unread');
    const punto = elemento.querySelector('.unread-dot');
    if (punto) punto.remove();

    const badge = document.getElementById('badgePendientes');
    const restantes = document.querySelectorAll('.notification-item.unread').length;
    if (restantes > 0) {
        badge.textContent = restantes;
    } else {
        badge.style.display = 'none';
    }

    try {
        await fetch('https://Nicol99gar.pythonanywhere.com/api/marcar_leida', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id_notificacion: idNotificacion, id_usuario: usuarioActual.id })
        });
    } catch (error) {
        console.error('No se pudo marcar como leída en el servidor:', error);
    }
}

cargarNotificaciones();
</script>

</body>
</html>
