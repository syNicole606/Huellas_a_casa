<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Lato', sans-serif;
    background: linear-gradient(135deg, #f0f7ff 0%, #e8f3fd 100%);
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(90deg, #7db8e0 0%, #93c9ee 100%);
    padding: 14px 32px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 3px 12px rgba(100,160,210,0.18);
  }
  .header-title {
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1.18rem;
    color: #fff; display: flex; align-items: center; gap: 10px;
  }
  .header-avatar {
    width: 38px; height: 38px; background: rgba(255,255,255,0.3);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    border: 2px solid rgba(255,255,255,0.5); cursor: pointer;
  }
  .header-avatar svg { width: 20px; height: 20px; fill: #fff; }

  .main {
    max-width: 680px;
    margin: 60px auto;
    padding: 0 24px;
  }

  .card {
    background: rgba(255,255,255,0.95);
    border-radius: 18px;
    box-shadow: 0 4px 24px rgba(100,160,210,0.12);
    border: 1.5px solid #d4eaf7;
    overflow: hidden;
  }
  .card-header {
    background: linear-gradient(90deg, #eaf4fc 0%, #f5faff 100%);
    padding: 14px 22px;
    border-bottom: 1.5px solid #d4eaf7;
    display: flex; align-items: center; gap: 9px;
  }
  .card-header-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #93c9ee, #7db8e0);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
  }
  .card-header-icon svg { width: 17px; height: 17px; fill: #fff; }
  .card-header-title {
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1rem; color: #5da0cc;
  }

  .card-body {
    padding: 40px 32px 32px;
    text-align: center;
  }
  .check-circle {
    width: 70px; height: 70px;
    background: linear-gradient(135deg, #d6f0e4, #aee0c4);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    border: 2px solid #a8ddc0;
  }
  .check-circle svg { width: 36px; height: 36px; fill: #2a8a55; }

  .confirm-text {
    font-family: 'Nunito', sans-serif;
    font-size: 1.18rem;
    font-weight: 700;
    color: #2c4a6b;
    line-height: 1.6;
    background: linear-gradient(90deg, #eaf4fc, #f5faff);
    border: 1.5px solid #d4eaf7;
    border-radius: 12px;
    padding: 24px 28px;
    margin-bottom: 32px;
  }
  .confirm-text span {
    color: #5da0cc;
  }

  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #7db8e0, #5da0cc);
    color: #fff; border: none; border-radius: 10px; padding: 12px 32px;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.97rem;
    cursor: pointer; box-shadow: 0 4px 12px rgba(100,160,210,0.25);
    display: flex; align-items: center; gap: 8px;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 7px 18px rgba(100,160,210,0.35); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .btn-danger {
    background: #fff;
    color: #c0392b;
    border: 2px solid #f5b3b3;
    border-radius: 10px; padding: 11px 24px;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.97rem;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: transform 0.15s, background 0.2s;
  }
  .btn-danger:hover { background: #fdf0f0; transform: translateY(-2px); }
  .btn-danger:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">🐾 Clínica Veterinaria Huellas a Casa</div>
  <div class="header-avatar">
    <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
  </div>
</div>

<div class="main">
  <div class="card">
    <div class="card-header">
      <div class="card-header-icon">
        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      </div>
      <span class="card-header-title">Agendación exitosa</span>
    </div>
    <div class="card-body">
      <div class="check-circle">
        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      </div>
      <div class="confirm-text">
        Tu cita ha sido agendada para el <span id="fecha">--/--/----</span> a las <span id="hora">0:00 AM</span>
      </div>
      <div class="actions">
        <button class="btn-primary" id="btnAceptar" onclick="window.location.href='index.html'">
          ✔ Aceptar
        </button>
        <button class="btn-danger" id="btnCancelar" onclick="cancelarCita()">
          ✖ Cancelar cita
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  // Si pasas fecha, hora e id_cita por URL:
  // citaagendada.html?fecha=27/05/2026&hora=10:30 AM&id_cita=123
  const params = new URLSearchParams(window.location.search);
  if (params.get('fecha')) document.getElementById('fecha').textContent = params.get('fecha');
  if (params.get('hora'))  document.getElementById('hora').textContent  = params.get('hora');

  const idCita = params.get('id_cita');

  function obtenerUsuario() {
    return JSON.parse(sessionStorage.getItem('usuario') || 'null');
  }

  async function cancelarCita() {
    const usuarioActual = obtenerUsuario();

    // Si por alguna razón no llegó el id de la cita, no hay nada que cancelar
    // en la base de datos: simplemente volvemos a citas.html sin haber creado
    // un registro "fantasma" en el panel.
    if (!idCita) {
      window.location.href = 'citas.html';
      return;
    }

    if (!usuarioActual) {
      window.location.href = 'citas.html';
      return;
    }

    const btnCancelar = document.getElementById('btnCancelar');
    const btnAceptar = document.getElementById('btnAceptar');
    btnCancelar.disabled = true;
    btnAceptar.disabled = true;
    btnCancelar.textContent = 'Cancelando...';

    try {
      const respuesta = await fetch('https://Nicol99gar.pythonanywhere.com/api/cancelar_cita', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id_cita: idCita,
          id_usuario: usuarioActual.id
        })
      });

      const data = await respuesta.json();

      if (data.exito) {
        window.location.href = 'citas.html';
      } else {
        alert(data.mensaje || 'No se pudo cancelar la cita.');
        btnCancelar.disabled = false;
        btnAceptar.disabled = false;
        btnCancelar.textContent = '✖ Cancelar cita';
      }
    } catch (error) {
      alert('Error de conexión al cancelar la cita.');
      console.error(error);
      btnCancelar.disabled = false;
      btnAceptar.disabled = false;
      btnCancelar.textContent = '✖ Cancelar cita';
    }
  }
</script>

</body>
</html>
