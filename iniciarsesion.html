<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fdf2f5;
      font-family: 'Segoe UI', sans-serif;
    }

    .card {
      background: #fff8f9;
      border: 1px solid #f4c0d1;
      border-radius: 20px;
      padding: 2.5rem 2rem 2rem;
      width: 360px;
      position: relative;
      box-shadow: 0 4px 24px rgba(212, 83, 126, 0.08);
    }

    .close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: 1.5px solid #ED93B1;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #D4537E;
      font-size: 16px;
      line-height: 1;
      text-decoration: none;
    }
    .close-btn:hover { background: #FBEAF0; }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      color: #D4537E;
      font-size: 13px;
      padding: 0;
      margin-bottom: 1.2rem;
      text-decoration: none;
    }
    .btn-back:hover { color: #993556; }
    .btn-back::before { content: "←"; }

    .title {
      text-align: center;
      font-size: 22px;
      font-weight: 600;
      color: #993556;
      margin-bottom: 1.8rem;
    }

    .form-input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #F4C0D1;
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
      color: #72243E;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: #D4537E;
      box-shadow: 0 0 0 3px rgba(212,83,126,0.12);
    }
    .form-input::placeholder { color: #ED93B1; }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 12px;
      background: #F4C0D1;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      color: #72243E;
      cursor: pointer;
      margin-bottom: 1.2rem;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #ED93B1; }

    .divider {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1rem;
    }
    .divider hr { flex: 1; border: none; border-top: 1px solid #F4C0D1; }
    .divider span { font-size: 12px; color: #ED93B1; white-space: nowrap; }

    .btn-social {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 14px;
      background: #fff;
      border: 1px solid #F4C0D1;
      border-radius: 10px;
      font-size: 14px;
      color: #72243E;
      cursor: pointer;
      margin-bottom: 0.75rem;
      transition: background 0.2s;
      text-align: left;
    }
    .btn-social:hover { background: #FBEAF0; }
  </style>
</head>
<body>

<div class="card">
  <a href="index.html" class="close-btn" title="Cerrar">✕</a>
  <a href="index.html" class="btn-back">Volver</a>

  <p class="title">🐾 Iniciar sesión</p>

  <input class="form-input" type="email" id="correo" placeholder="correo" />
<input class="form-input" type="password" id="contrasena" placeholder="contraseña" />
<p id="mensaje" style="color:#D4537E; font-size:13px;"></p>
<button class="btn-primary" onclick="iniciarSesion()">Iniciar sesión</button>
<a href="registrarse.html" class="btn-back" style="margin-top:10px;">¿No tienes cuenta? Regístrate</a>
<script>
async function iniciarSesion() {
  const correo = document.getElementById('correo').value.trim();
  const contrasena = document.getElementById('contrasena').value;
  const mensaje = document.getElementById('mensaje');

  try {
    const respuesta = await fetch('https://huellas-a-casa-backend.onrender.com/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ correo, contrasena })
    });

    const data = await respuesta.json();

    if (data.exito) {
      // Guardamos el usuario en sesión del navegador para usarlo en otras páginas
      sessionStorage.setItem('usuario', JSON.stringify(data.usuario));
      window.location.href = 'index.html';
    } else {
      mensaje.textContent = data.mensaje;
    }
  } catch (error) {
    mensaje.textContent = "Error de conexión con el servidor.";
    console.error(error);
  }
}
</script>
</body>
</html>
